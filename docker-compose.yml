services:
  postgres:
    image: postgres:17-alpine
    container_name: devpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - devpulse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile

    container_name: devpulse-api
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES:-60}

    volumes:
      # Mount a local ./geoip directory holding GeoLite2-City.mmdb so the
      # API can resolve approximate country/region. Optional: without it
      # geography reports as Unknown. See docs/tracking.md.
      - ./geoip:/geoip:ro

    ports:
      - "${HOST_API_PORT:-5000}:${API_PORT}"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devpulse_postgres_data: