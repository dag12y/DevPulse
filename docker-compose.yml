services:
  postgres:
    image: postgres:17-alpine
    container_name: devpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - devpulse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile

    container_name: devpulse-api
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES:-60}
      TRACKER_DIR: /tracker-dist
      # Auth email (verification + password reset). Without a Resend key
      # the API prints links to its log (development only — production
      # refuses to boot, see .env.prod.example). APP_URL is the origin
      # those links point back to.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-DevPulse <onboarding@resend.dev>}"
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Optional social login; unset disables each provider.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

    volumes:
      # Mount a local ./geoip directory holding GeoLite2-City.mmdb so the
      # API can resolve approximate country/region. Optional: without it
      # geography reports as Unknown. See docs/tracking.md.
      - ./geoip:/geoip:ro
      # Live tracker bundle for local dev (run the tracker build first).
      # The production image already bakes dist/ into /tracker-dist.
      - ./packages/tracker/dist:/tracker-dist:ro

    ports:
      - "${HOST_API_PORT:-5000}:${API_PORT}"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT:-8080}/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devpulse_postgres_data: