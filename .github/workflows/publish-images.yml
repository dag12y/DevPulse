name: Publish production images

on:
  workflow_dispatch:
    inputs:
      public_api_url:
        description: Public API origin baked into the dashboard image
        required: true
        type: string
      public_tracker_url:
        description: Public tracker URL; leave empty to use the API origin
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
      PUBLIC_API_URL: ${{ inputs.public_api_url }}
      PUBLIC_TRACKER_URL: ${{ inputs.public_tracker_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tracker bundle for API image
        run: |
          pnpm --filter @devpulse/tracker build
          rm -rf services/api/tracker-dist
          mkdir -p services/api/tracker-dist
          cp packages/tracker/dist/analytics*.js services/api/tracker-dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devpulse-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devpulse-api:latest

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
            NEXT_PUBLIC_TRACKER_URL=${{ env.PUBLIC_TRACKER_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devpulse-dashboard:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/devpulse-dashboard:latest
